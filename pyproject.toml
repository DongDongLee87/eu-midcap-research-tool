[project]
name = "eu-midcap-research-tool"
version = "0.1.0"
description = "Comparables and football-field valuation tool for EU mid-cap equities"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=1.7.0",
    "pandas>=2.2.3",
    "pyarrow>=18.0.0",
    "streamlit>=1.38",
    "plotly>=5.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
